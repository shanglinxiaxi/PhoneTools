
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VisionCore 1.1</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b1020;
  --panel: #131b2d;
  --line: #27334a;
  --text: #e8edf7;
  --muted: #98a6bd;
  --accent: #67d5b5;
  --warn: #ffbe69;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: linear-gradient(135deg,#0b1020,#10192b);
  color: var(--text);
  font: 15px system-ui,-apple-system,"Segoe UI",sans-serif;
}
header,main { max-width: 1100px; margin: auto; }
header { padding: 22px 18px 10px; }
h1 { margin: 0; font-size: 25px; }
header p { color: var(--muted); }
main { padding: 14px; display: grid; gap: 14px; }
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 15px;
}
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 220px; }
label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 7px; }
.upload {
  border: 1px dashed #40506b;
  border-radius: 12px;
  padding: 12px;
  background: #0d1424;
}
input[type=file] { width: 100%; color: var(--muted); }
button {
  border: 0;
  background: var(--accent);
  color: #07151a;
  font-weight: 700;
  border-radius: 10px;
  padding: 12px 16px;
  cursor: pointer;
}
button.secondary {
  background: #26334b;
  color: var(--text);
  border: 1px solid var(--line);
}
button:disabled { opacity: .45; cursor: not-allowed; }
.controls {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 12px;
}
.controls input[type=range] { flex: 1; min-width: 130px; }
.previewGrid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
}
.preview {
  background: #090e19;
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  min-height: 180px;
}
.preview h3 { font-size: 13px; color: var(--muted); padding: 10px; margin: 0; }
.preview canvas { width: 100%; height: auto; display: block; }
.empty { padding: 25px; text-align: center; color: #71819c; }
.stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.stat {
  border: 1px solid var(--line);
  background: #0c1424;
  border-radius: 12px;
  padding: 13px;
}
.stat b { display: block; font-size: 23px; margin-top: 5px; }
.stat span { color: var(--muted); font-size: 12px; }
.eventList { display: grid; gap: 8px; }
.event {
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #0d1424;
  font-size: 13px;
}
.event small { color: var(--muted); }
.footer { color: var(--muted); font-size: 12px; text-align: center; padding: 6px 0 20px; }
@media(max-width:700px) {
  .previewGrid { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<header>
  <h1>VisionCore <span style="color:var(--accent)">1.1</span></h1>
  <p>轻量视觉异常发现 · 观察 / 对比 / 找差 / 量化 / 提醒</p>
</header>

<main>

<section class="card">
  <div class="row">
    <div class="upload">
      <label>基准画面（正常状态）</label>
      <input id="baseFile" type="file" accept="image/*">
    </div>
    <div class="upload">
      <label>当前画面（待比较）</label>
      <input id="currentFile" type="file" accept="image/*">
    </div>
  </div>

  <div class="controls">
    <label>差异灵敏度 <span id="thresholdLabel">35</span></label>
    <input id="threshold" type="range" min="5" max="100" value="35">

    <label>区域过滤强度 <span id="noiseLabel">3</span></label>
    <input id="noise" type="range" min="1" max="9" value="3">

    <button id="analyze" disabled>开始对比</button>
    <button class="secondary" id="reset">重置</button>
  </div>
</section>

<section class="stats">
  <div class="stat">
    <span>过滤后变化比例</span>
    <b id="changePct">—</b>
  </div>
  <div class="stat">
    <span>变化像素数量</span>
    <b id="changePixels">—</b>
  </div>
  <div class="stat">
    <span>检测状态</span>
    <b id="status">待输入</b>
  </div>
</section>

<section class="card">
  <div class="previewGrid">
    <div class="preview">
      <h3>基准画面</h3>
      <canvas id="baseCanvas"></canvas>
      <div id="baseEmpty" class="empty">选择基准图像</div>
    </div>
    <div class="preview">
      <h3>当前画面</h3>
      <canvas id="currentCanvas"></canvas>
      <div id="currentEmpty" class="empty">选择当前图像</div>
    </div>
    <div class="preview">
      <h3>差异叠加（红色区域）</h3>
      <canvas id="diffCanvas"></canvas>
      <div id="diffEmpty" class="empty">等待对比</div>
    </div>
  </div>
</section>

<section class="card">
  <h3>异常事件记录</h3>
  <div id="events" class="eventList">
    <div class="empty">暂无事件</div>
  </div>
</section>

<div class="footer">
  VisionCore 1.1 · Local-first · Images processed in browser
</div>
</main>

<script>
/* =========================
   1. Signal Adapter Layer
========================= */

class ImageAdapter {
  async load(file) {
    return loadImageFile(file);
  }
}

class FileImageAdapter extends ImageAdapter {}

const adapterRegistry = {
  image: new FileImageAdapter()
};

function loadImageFile(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();

    img.onload = () => {
      URL.revokeObjectURL(url);
      resolve(img);
    };

    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("图像读取失败"));
    };

    img.src = url;
  });
}

/* =========================
   2. Application State
========================= */

const $ = id => document.getElementById(id);

let baseImg = null;
let currentImg = null;
const events = [];

function updateReady() {
  $("analyze").disabled = !(baseImg && currentImg);
}

/* =========================
   3. Preview Rendering
========================= */

function drawPreview(canvas, img) {
  if (!img) return;

  const maxW = 800;
  const maxH = 520;
  const scale = Math.min(maxW / img.width, maxH / img.height, 1);

  canvas.width = Math.max(1, Math.round(img.width * scale));
  canvas.height = Math.max(1, Math.round(img.height * scale));

  canvas.getContext("2d").drawImage(
    img, 0, 0, canvas.width, canvas.height
  );
}

async function loadInto(which, file) {
  const img = await adapterRegistry.image.load(file);

  if (which === "base") {
    baseImg = img;
    drawPreview($("baseCanvas"), img);
    $("baseEmpty").style.display = "none";
  } else {
    currentImg = img;
    drawPreview($("currentCanvas"), img);
    $("currentEmpty").style.display = "none";
  }

  updateReady();
}

$("baseFile").addEventListener("change", async e => {
  try {
    if (e.target.files[0]) {
      await loadInto("base", e.target.files[0]);
    }
  } catch (err) {
    alert(err.message);
  }
});

$("currentFile").addEventListener("change", async e => {
  try {
    if (e.target.files[0]) {
      await loadInto("current", e.target.files[0]);
    }
  } catch (err) {
    alert(err.message);
  }
});

/* =========================
   4. Settings
========================= */

$("threshold").oninput = () => {
  $("thresholdLabel").textContent = $("threshold").value;
};

$("noise").oninput = () => {
  $("noiseLabel").textContent = $("noise").value;
};

/* =========================
   5. Image Normalization
   Keep aspect ratio, no stretching
========================= */

function normalize(img, width, height) {
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, width, height);

  const scale = Math.min(
    width / img.width,
    height / img.height
  );

  const drawW = img.width * scale;
  const drawH = img.height * scale;

  ctx.drawImage(
    img,
    (width - drawW) / 2,
    (height - drawH) / 2,
    drawW,
    drawH
  );

  return ctx.getImageData(0, 0, width, height);
}

/* =========================
   6. Difference Detection
========================= */

function analyze() {
  if (!baseImg || !currentImg) return;

  const width = 720;
  const height = 480;

  const base = normalize(baseImg, width, height);
  const current = normalize(currentImg, width, height);

  const threshold = Number($("threshold").value);
  const minNeighbors = Number($("noise").value);

  const raw = new Uint8Array(width * height);

  // Pixel difference detection
  for (let p = 0, i = 0; p < raw.length; p++, i += 4) {
    const diff = (
      Math.abs(base.data[i] - current.data[i]) +
      Math.abs(base.data[i + 1] - current.data[i + 1]) +
      Math.abs(base.data[i + 2] - current.data[i + 2])
    ) / 3;

    if (diff >= threshold) {
      raw[p] = 1;
    }
  }

  // Neighborhood noise filtering
  const filtered = new Uint8Array(width * height);
  let changed = 0;

  for (let y = 1; y < height - 1; y++) {
    for (let x = 1; x < width - 1; x++) {
      const p = y * width + x;

      if (!raw[p]) continue;

      let neighbors = 0;

      for (let yy = -1; yy <= 1; yy++) {
        for (let xx = -1; xx <= 1; xx++) {
          neighbors += raw[(y + yy) * width + x + xx];
        }
      }

      if (neighbors >= minNeighbors) {
        filtered[p] = 1;
        changed++;
      }
    }
  }

  // Draw difference overlay
  const canvas = $("diffCanvas");
  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d");
  ctx.putImageData(current, 0, 0);

  ctx.fillStyle = "rgba(255,55,65,.62)";

  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      if (filtered[y * width + x]) {
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }

  $("diffEmpty").style.display = "none";

  const pct = changed / (width * height) * 100;

  $("changePct").textContent = pct.toFixed(2) + "%";
  $("changePixels").textContent = changed.toLocaleString() + " px";

  const state = pct >= 1 ? "发现变化" : "变化较小";
  $("status").textContent = state;
  $("status").style.color =
    pct >= 1 ? "var(--warn)" : "var(--accent)";

  // Record event
  events.unshift({
    time: new Date().toLocaleString(),
    pct: pct.toFixed(2),
    pixels: changed,
    state,
    threshold,
    minNeighbors
  });

  renderEvents();
}

/* =========================
   7. Event Log
========================= */

function renderEvents() {
  $("events").innerHTML = events.slice(0, 20)
    .map(e => `
      <div class="event">
        <strong>${e.state}</strong> · ${e.pct}% 差异 ·
        ${e.pixels.toLocaleString()} px
        <br>
        <small>
          ${e.time} · 灵敏度 ${e.threshold} ·
          区域过滤 ${e.minNeighbors}/9
        </small>
      </div>
    `).join("") || '<div class="empty">暂无事件</div>';
}

/* =========================
   8. Controls
========================= */

$("analyze").onclick = analyze;

$("reset").onclick = () => {
  baseImg = null;
  currentImg = null;

  ["baseFile", "currentFile"].forEach(id => {
    $(id).value = "";
  });

  ["baseCanvas", "currentCanvas", "diffCanvas"].forEach(id => {
    const canvas = $(id);
    canvas.width = 0;
    canvas.height = 0;
  });

  ["baseEmpty", "currentEmpty", "diffEmpty"].forEach(id => {
    $(id).style.display = "block";
  });

  $("changePct").textContent = "—";
  $("changePixels").textContent = "—";
  $("status").textContent = "待输入";
  $("status").style.color = "";

  events.length = 0;
  renderEvents();
  updateReady();
};
</script>
</body>
</html>
