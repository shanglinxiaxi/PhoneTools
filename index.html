
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>VisionCore</title>
<style>
:root {
  color-scheme: dark;
  --bg:#0b1015; --panel:#141c24; --line:#263442;
  --text:#e7edf4; --muted:#92a1b2; --accent:#65d6a3;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
header {
  padding:22px 18px 16px; border-bottom:1px solid var(--line);
  position:sticky; top:0; background:var(--bg); z-index:2;
}
.brand { font-size:22px; font-weight:800; letter-spacing:.5px; }
.brand span { color:var(--accent); }
.sub { font-size:12px; color:var(--muted); margin-top:6px; }
main { max-width:850px; margin:auto; padding:16px; }
.panel {
  background:var(--panel); border:1px solid var(--line);
  border-radius:15px; padding:16px; margin-bottom:14px;
}
h2 { font-size:16px; margin:0 0 14px; }
label { display:block; font-size:12px; color:var(--muted); margin:12px 0 6px; }
input,textarea,select {
  width:100%; background:#0d141b; color:var(--text);
  border:1px solid var(--line); border-radius:9px;
  padding:11px; font-size:14px; outline:none;
}
textarea { resize:vertical; min-height:90px; line-height:1.5; }
input:focus,textarea:focus { border-color:var(--accent); }
button {
  background:var(--accent); color:#062117; border:0;
  border-radius:10px; padding:12px 15px; font-weight:700;
  font-size:14px; cursor:pointer;
}
button.secondary {
  background:#24313d; color:var(--text); border:1px solid var(--line);
}
button.danger { background:#39232a; color:#ff9ca8; }
.actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.drop {
  border:1px dashed #3c5364; border-radius:12px;
  padding:20px 12px; text-align:center; color:var(--muted);
}
.drop.drag { border-color:var(--accent); background:#142820; }
#preview {
  display:none; width:100%; max-height:420px;
  object-fit:contain; border-radius:10px; margin-top:12px;
  background:#070b0f;
}
.grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.result {
  white-space:pre-wrap; word-break:break-word;
  line-height:1.65; font-size:14px;
  min-height:60px;
}
.status { color:var(--muted); font-size:12px; margin-top:10px; }
.ruleout { margin-top:10px; border-radius:10px; padding:12px; background:#0c141a; }
.good { color:var(--accent); }
.bad { color:#ffb66e; }
.log {
  border-top:1px solid var(--line); padding:12px 0;
  font-size:13px; line-height:1.5;
}
.log small { color:var(--muted); }
footer { text-align:center; color:var(--muted); font-size:11px; padding:20px; }
@media(max-width:560px) {
  .grid { grid-template-columns:1fr; }
  main { padding:11px; }
  .panel { padding:13px; }
}
</style>
</head>
<body>
<header>
  <div class="brand">Vision<span>Core</span></div>
  <div class="sub">视觉识别 · 状态分析 · AI 辅助判断</div>
</header>

<main>
  <section class="panel">
    <h2>① 画面输入</h2>
    <div class="drop" id="drop">
      点击选择图片，或将图片拖入此处
      <input id="file" type="file" accept="image/*" hidden>
      <div class="actions" style="justify-content:center">
        <button id="choose" type="button">选择图片</button>
        <button id="clearImage" class="secondary" type="button">清除</button>
      </div>
    </div>
    <img id="preview" alt="图片预览">
    <div class="status" id="imageInfo">尚未载入图片</div>
  </section>

  <section class="panel">
    <h2>② AI 分析设置</h2>
    <label>API 地址（OpenAI 兼容 Chat Completions）</label>
    <input id="endpoint" placeholder="https://api.openai.com/v1/chat/completions">

    <label>模型名称</label>
    <input id="model" placeholder="填写支持图像输入的模型名称">

    <label>API Key（仅本次页面运行期间保存在内存）</label>
    <input id="apiKey" type="password" autocomplete="off" placeholder="API Key">

    <label>分析提示词</label>
    <textarea id="prompt">请客观分析图片内容。
1. 描述当前画面及主要元素。
2. 提取可辨识文字、数字、图标和状态。
3. 区分明确识别的信息与不确定推测。
4. 给出简洁的状态判断。
不要臆造图片中不存在的信息。</textarea>

    <div class="actions">
      <button id="analyze" type="button">开始分析</button>
      <button id="saveSettings" class="secondary" type="button">保存设置</button>
    </div>
    <div class="status" id="analysisStatus">待命</div>
  </section>

  <section class="panel">
    <h2>③ 变量与条件判断</h2>
    <label>当前变量（每行一个，格式：名称=数值）</label>
    <textarea id="variables" placeholder="容量=75&#10;温度=32&#10;余额=1200"></textarea>

    <label>判断规则（每行一条）</label>
    <textarea id="rules" placeholder="容量 >= 80&#10;温度 > 40&#10;余额 <= 100"></textarea>

    <button id="checkRules" class="secondary" type="button" style="margin-top:10px">执行变量判断</button>
    <div id="ruleResults" class="result" style="margin-top:12px">尚未执行判断</div>
  </section>

  <section class="panel">
    <h2>④ 分析结果</h2>
    <div id="result" class="result">分析结果将在这里显示。</div>
    <div class="actions">
      <button id="copyResult" class="secondary" type="button">复制结果</button>
      <button id="saveLog" class="secondary" type="button">保存到历史</button>
    </div>
  </section>

  <section class="panel">
    <h2>⑤ 本地历史</h2>
    <div id="logs">暂无记录</div>
    <button id="clearLogs" class="danger" type="button">清空历史</button>
  </section>
</main>

<footer>VisionCore · Local-first interface</footer>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let imageData = "";
  let currentResult = "";
  let logs = JSON.parse(localStorage.getItem("vc_logs") || "[]");

  // Restore non-secret settings only
  const settings = JSON.parse(localStorage.getItem("vc_settings") || "{}");
  $("endpoint").value = settings.endpoint || "https://api.openai.com/v1/chat/completions";
  $("model").value = settings.model || "";
  $("prompt").value = settings.prompt || $("prompt").value;
  $("variables").value = settings.variables || "";
  $("rules").value = settings.rules || "";

  function saveSettings() {
    localStorage.setItem("vc_settings", JSON.stringify({
      endpoint:$("endpoint").value.trim(),
      model:$("model").value.trim(),
      prompt:$("prompt").value,
      variables:$("variables").value,
      rules:$("rules").value
    }));
    $("analysisStatus").textContent = "设置已保存在本机浏览器（API Key 不保存）";
  }

  $("saveSettings").onclick = saveSettings;

  function loadImage(file) {
    if (!file || !file.type.startsWith("image/")) {
      alert("请选择有效的图片文件。");
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      imageData = reader.result;
      $("preview").src = imageData;
      $("preview").style.display = "block";
      $("imageInfo").textContent = `${file.name} · ${(file.size/1024).toFixed(1)} KB`;
    };
    reader.readAsDataURL(file);
  }

  $("choose").onclick = () => $("file").click();
  $("file").onchange = e => loadImage(e.target.files[0]);
  $("clearImage").onclick = () => {
    imageData = "";
    $("preview").src = "";
    $("preview").style.display = "none";
    $("file").value = "";
    $("imageInfo").textContent = "尚未载入图片";
  };

  const drop = $("drop");
  drop.addEventListener("dragover", e => {
    e.preventDefault(); drop.classList.add("drag");
  });
  drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
  drop.addEventListener("drop", e => {
    e.preventDefault(); drop.classList.remove("drag");
    loadImage(e.dataTransfer.files[0]);
  });

  async function analyze() {
    if (!imageData) return alert("请先载入图片。");
    const endpoint = $("endpoint").value.trim();
    const model = $("model").value.trim();
    const key = $("apiKey").value.trim();
    if (!endpoint || !model || !key) {
      return alert("请填写 API 地址、模型名称和 API Key。");
    }

    $("analyze").disabled = true;
    $("analysisStatus").textContent = "正在分析图片…";
    $("result").textContent = "分析中…";

    try {
      const response = await fetch(endpoint, {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer " + key
        },
        body:JSON.stringify({
          model,
          messages:[{
            role:"user",
            content:[
              {type:"text", text:$("prompt").value},
              {type:"image_url", image_url:{url:imageData}}
            ]
          }],
          temperature:0.2
        })
      });

      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error?.message || `HTTP ${response.status}`);
      }
      currentResult = data.choices?.[0]?.message?.content || JSON.stringify(data,null,2);
      $("result").textContent = currentResult;
      $("analysisStatus").textContent = "分析完成";
    } catch(err) {
      currentResult = "";
      $("result").textContent = "分析失败：\n" + err.message;
      $("analysisStatus").textContent = "请求失败，请检查网络、API 地址、模型和密钥。";
    } finally {
      $("analyze").disabled = false;
    }
  }
  $("analyze").onclick = analyze;

  function parseVariables() {
    const values = {};
    $("variables").value.split(/\n/).forEach(line => {
      const m = line.match(/^\s*([^=]+?)\s*=\s*(-?\d+(?:\.\d+)?)\s*$/);
      if (m) values[m[1]] = Number(m[2]);
    });
    return values;
  }

  function runRules() {
    const vars = parseVariables();
    const lines = $("rules").value.split(/\n/).filter(x => x.trim());
    if (!lines.length) {
      $("ruleResults").textContent = "请先输入判断规则。";
      return;
    }
    const out = lines.map(rule => {
      const m = rule.match(/^\s*(.+?)\s*(>=|<=|==|!=|>|<)\s*(-?\d+(?:\.\d+)?)\s*$/);
      if (!m) return `⚠ 无法解析规则：${rule}`;
      const name = m[1].trim(), op = m[2], target = Number(m[3]);
      if (!(name in vars)) return `⚠ ${name}：未设置变量值`;
      const value = vars[name];
      let pass = false;
      switch(op) {
        case ">": pass = value > target; break;
        case "<": pass = value < target; break;
        case ">=": pass = value >= target; break;
        case "<=": pass = value <= target; break;
        case "==": pass = value === target; break;
        case "!=": pass = value !== target; break;
      }
      return `${pass ? "✓ 满足" : "✗ 不满足"}：${name} ${op} ${target}（当前 ${value}）`;
    });
    $("ruleResults").textContent = out.join("\n");
  }
  $("checkRules").onclick = runRules;

  $("copyResult").onclick = async () => {
    if (!currentResult) return alert("没有可复制的分析结果。");
    await navigator.clipboard.writeText(currentResult);
    alert("已复制。");
  };

  function renderLogs() {
    if (!logs.length) { $("logs").textContent = "暂无记录"; return; }
    $("logs").innerHTML = logs.map((l,i) => `
      <div class="log">
        <strong>${escapeHTML(l.title)}</strong><br>
        <small>${escapeHTML(l.time)}</small>
        <div style="margin-top:6px;white-space:pre-wrap">${escapeHTML(l.text)}</div>
      </div>`).join("");
  }

  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  $("saveLog").onclick = () => {
    if (!currentResult) return alert("没有分析结果可以保存。");
    logs.unshift({
      title:"视觉分析记录",
      time:new Date().toLocaleString(),
      text:currentResult
    });
    logs = logs.slice(0,50);
    localStorage.setItem("vc_logs", JSON.stringify(logs));
    renderLogs();
  };

  $("clearLogs").onclick = () => {
    if (!confirm("确定清空所有本地历史记录？")) return;
    logs = [];
    localStorage.removeItem("vc_logs");
    renderLogs();
  };

  renderLogs();
})();
</script>
</body>
</html>
